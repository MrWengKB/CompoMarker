<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作文批改</title>
  <meta name="description" content="拍照上传手写作文，AI 识别文字并按评分标准批改，标出错别字和病句。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="" width="32" height="32">
      <span>作文批改</span>
    </div>
    <nav class="top-actions">
      <button type="button" class="btn ghost" id="btn-history">历史记录</button>
      <button type="button" class="btn ghost" id="btn-settings">设置</button>
    </nav>
  </header>

  <main class="container">
    <div id="key-banner" class="banner" hidden>
      还没有配置模型 API Key。<button type="button" class="link" id="banner-settings">去设置</button>
      （Key 只保存在你自己的浏览器里）
    </div>

    <!-- 第一步：上传 -->
    <section class="card" id="step-upload">
      <h2><span class="step">1</span>上传作文（照片或 PDF）</h2>
      <label class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept="image/*,application/pdf,.pdf" multiple hidden>
        <strong>点击拍照，或选择图片 / PDF</strong>
        <span>也可以把文件拖到这里。一篇作文有多页时，按顺序选择多张图片，或上传一个多页 PDF。</span>
      </label>
      <ul class="thumbs" id="thumbs"></ul>
      <div class="row">
        <button type="button" class="btn primary" id="btn-ocr" disabled>识别文字</button>
        <button type="button" class="btn ghost" id="btn-skip-ocr">没有照片，直接粘贴文字</button>
        <span class="status" id="ocr-status"></span>
      </div>
    </section>

    <!-- 第二步：核对原文 -->
    <section class="card" id="step-text" hidden>
      <h2><span class="step">2</span>核对原文</h2>
      <p class="hint">识别结果可能有误，请对照照片改正<strong>识别错误</strong>，但<strong>学生本身写错的字请保留</strong>，这样才能批改出来。第一行写「标题：…」会被当作题目。</p>
      <textarea id="essay-text" rows="14" placeholder="标题：我的妈妈&#10;&#10;第一段……&#10;&#10;第二段……"></textarea>
      <div class="stats" id="stats"></div>
    </section>

    <!-- 第三步：批改设置 -->
    <section class="card" id="step-config" hidden>
      <h2><span class="step">3</span>批改要求</h2>
      <div class="grid">
        <label>年级
          <select id="grade">
            <option>三年级</option><option>四年级</option>
            <option selected>五年级</option><option>六年级</option>
          </select>
        </label>
        <label>字数要求（不少于）
          <input type="number" id="min-words" min="0" step="50" placeholder="不限">
        </label>
        <label>批改风格
          <select id="style">
            <option value="strict">严格（按考试标准）</option>
            <option value="normal" selected>适中</option>
            <option value="encourage">鼓励为主</option>
          </select>
        </label>
        <label class="span-3">作文题目
          <input type="text" id="title" placeholder="不填则使用原文第一行的标题">
        </label>
        <label class="span-3">写作要求 / 材料（可选）
          <textarea id="requirement" rows="3" placeholder="例如：根据三幅图写一篇作文，图一……图二……图三……（看图作文请把图意写在这里，方便判断是否切合图意）"></textarea>
        </label>
      </div>

      <div class="rubric-head">
        <h3>评分标准</h3>
        <select id="rubric-preset"></select>
      </div>
      <table class="rubric" id="rubric-table">
        <thead><tr><th>维度</th><th class="num">满分</th><th>评分要点</th><th></th></tr></thead>
        <tbody></tbody>
        <tfoot><tr><td><button type="button" class="link" id="rubric-add">+ 添加维度</button></td><td class="num" id="rubric-total"></td><td colspan="2"></td></tr></tfoot>
      </table>

      <label class="guide-label">评分细则（等级说明与特别规定，会交给 AI 参考，可修改）
        <textarea id="rubric-guide" rows="8"></textarea>
      </label>

      <div class="row">
        <button type="button" class="btn primary" id="btn-mark">开始批改</button>
        <span class="status" id="mark-status"></span>
      </div>
    </section>

    <!-- 第四步：结果 -->
    <section class="card" id="step-result" hidden>
      <div class="result-head">
        <h2><span class="step">4</span>批改结果</h2>
        <div class="row no-print">
          <button type="button" class="btn ghost" id="btn-copy">复制报告</button>
          <button type="button" class="btn ghost" id="btn-print">打印</button>
          <button type="button" class="btn ghost" id="btn-remark">重新批改</button>
        </div>
      </div>
      <div id="result"></div>
    </section>
  </main>

  <footer class="footer no-print">
    API Key 仅保存在本机浏览器，作文内容直接发送给你所选的模型服务商。
    <a href="https://github.com/MrWengKB/CompoMarker" target="_blank" rel="noopener">源代码</a>
  </footer>

  <!-- 设置 -->
  <dialog id="dlg-settings">
    <form method="dialog" class="dlg">
      <h2>模型设置</h2>
      <label>服务商
        <select id="s-provider"></select>
      </label>
      <label id="s-cf-wrap" hidden>中转地址（填你的 Cloudflare 用户名）
        <span class="url-compose">
          <span class="url-fixed">https://compomarker.</span>
          <input type="text" id="s-cf-user" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="用户名">
          <span class="url-fixed">.workers.dev/qwen-intl</span>
        </span>
        <small class="hint">用户名在 Cloudflare 控制台 Workers 页面上，Worker 地址里 compomarker. 和 .workers.dev 之间的那一段。</small>
      </label>
      <label><span id="s-key-label">API Key</span>
        <input type="password" id="s-key" autocomplete="off" spellcheck="false">
        <small id="s-key-hint" class="hint"></small>
      </label>
      <label class="check"><input type="checkbox" id="s-remember"> 在这台设备上记住 Key（不勾选则关闭页面后清除）</label>
      <details>
        <summary>高级设置</summary>
        <label id="s-base-wrap">接口地址（Base URL）
          <input type="text" id="s-base" spellcheck="false" placeholder="使用默认地址">
          <small class="hint">如果浏览器直连被拦截，可以填自建的 Cloudflare Worker 中转地址。</small>
        </label>
        <label>识别模型（需支持图片）
          <input type="text" id="s-vision" spellcheck="false">
        </label>
        <label>批改模型
          <input type="text" id="s-text" spellcheck="false">
        </label>
        <button type="button" class="link" id="s-reset">恢复该服务商的默认模型和地址</button>
      </details>
      <div class="row end">
        <button type="button" class="btn ghost danger" id="s-clear">清除所有已保存的 Key</button>
        <button value="cancel" class="btn ghost">取消</button>
        <button value="save" class="btn primary" id="s-save">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 历史 -->
  <dialog id="dlg-history">
    <div class="dlg">
      <h2>历史记录</h2>
      <p class="hint">只保存在本机浏览器，最多 30 条。</p>
      <ul class="history" id="history-list"></ul>
      <div class="row end">
        <button type="button" class="btn ghost danger" id="h-clear">清空</button>
        <button type="button" class="btn primary" id="h-close">关闭</button>
      </div>
    </div>
  </dialog>

  <div class="popover" id="popover" role="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
